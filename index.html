<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="music player">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="src/css/style.css">
  <title>Reamusic</title>
</head>
<body class="bg-slate-950 text-slate-300 overflow-hidden">
  <div class="loading fixed inset-0 z-50 bg-slate-900 flex flex-col justify-center items-center gap-1">
    <div class="logo w-45">
      <img class="w-full" src="/images/logo/Reamusic-logo.png" alt="Reamusic-logo">
    </div>
    <svg xmlns="http://www.w3.org/2000/svg" width="33" height="33" viewBox="0 0 24 24" fill="none" stroke="#7f22fe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-loader-circle preview-icon animate-spin"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
    <p>Loading...</p>
    <p class="text-sm text-gray-400">Please wait a moment</p>
  </div>
  <audio id="music-player" src=""></audio>
  <div class="music-player w-full h-40 lg:h-20 flex flex-col bg-slate-900 fixed bottom-0 z-30 border-t lg:border-none hidden">
    <input class="music-id" type="hidden" name="music-id" value="">
    <div class="h-3/5 p-2 flex justify-between items-center lg:hidden">
      <div class="music-card-mobile h-full flex items-center">
        <div class="music-cover h-full relative aspect-square">
          <img class="h-full border border-slate-300 rounded-xl" src="/images/covers/cover-01.png" alt="">
          <div class="music-cover-fallback w-full h-full aspect-square flex justify-center items-center rounded-xl border border-slate-300 bg-slate-900 group transition duration-400 hidden">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7f22fe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eighth-notes preview-icon"><path d="M21 16V3a1 1 0 0 0-1.28-.96l-10 2.917a1 1 0 0 0-.72.96V19"/><circle cx="18" cy="16" r="3"/><circle cx="6" cy="19" r="3"/></svg>
          </div>
          <div class="music-cover-filter w-full aspect-square rounded-xl border border-slate-300 bg-black/25 absolute top-0"></div>
        </div>
        <div class="music-name ml-5">
          <span class="text-lg">Music Name</span>
          <br>
          <span class="text-gray-400">Artist</span>
        </div>
      </div>
      <span class="time-mobile text-slate-400"><span class="current"></span> / <span class="duration"></span></span>
    </div>
    <div class="music-progress w-full">
      <input type="range" min="0" max="100" value="0" name="progress" id="progress" class="w-full h-1 bg-slate-300 accent-violet-600 absolute transition [&::-webkit-slider-thumb]:opacity-0 cursor-pointer">
    </div>
    <div class="h-full p-2 flex justify-between">
      <div class="music-card-desktop h-full lg:flex lg:items-center hidden">
        <div class="music-cover h-full relative aspect-square">
          <img class="h-full border border-slate-300 rounded-xl" src="/images/covers/cover-01.png" alt="">
          <div class="music-cover-fallback w-full h-full aspect-square flex justify-center items-center rounded-xl border border-slate-300 bg-slate-900 group transition duration-400 hidden">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7f22fe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eighth-notes preview-icon"><path d="M21 16V3a1 1 0 0 0-1.28-.96l-10 2.917a1 1 0 0 0-.72.96V19"/><circle cx="18" cy="16" r="3"/><circle cx="6" cy="19" r="3"/></svg>
          </div>
          <div class="music-cover-filter w-full aspect-square rounded-xl border border-slate-300 bg-black/25 absolute top-0"></div>
        </div>
        <div class="music-name ml-5">
          <span class="text-lg">Music Name</span>
          <br>
          <span class="text-gray-400">Artist</span>
        </div>
      </div>
      <div class="music-controls flex justify-center items-center gap-2">
        <span class="previous w-8 h-8 md:w-10 md:h-10 flex justify-center items-center cursor-pointer">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#cad5e2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-skip-back preview-icon w-4 h-4 md:w-5 md:h-5"><path d="M17.971 4.285A2 2 0 0 1 21 6v12a2 2 0 0 1-3.029 1.715l-9.997-5.998a2 2 0 0 1-.003-3.432z"/><path d="M3 20V4"/></svg>
        </span>
        <span class="play w-8 h-8 md:w-10 md:h-10 flex justify-center items-center rounded-full bg-violet-600 hover:bg-violet-900 cursor-pointer transition duration-400 hidden">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#cad5e2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-play preview-icon w-4 h-4 md:w-5 md:h-5"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></svg>
        </span>
        <span class="pause w-8 h-8 md:w-10 md:h-10 flex justify-center items-center rounded-full bg-violet-600 hover:bg-violet-900 cursor-pointer transition duration-400">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#cad5e2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-pause preview-icon w-4 h-4 md:w-5 md:h-5"><rect x="14" y="3" width="5" height="18" rx="1"/><rect x="5" y="3" width="5" height="18" rx="1"/></svg>
        </span>
        <span class="next w-8 h-8 md:w-10 md:h-10 flex justify-center items-center cursor-pointer">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#cad5e2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-skip-forward preview-icon w-4 h-4 md:w-5 md:h-5"><path d="M21 4v16"/><path d="M6.029 4.285A2 2 0 0 0 3 6v12a2 2 0 0 0 3.029 1.715l9.997-5.998a2 2 0 0 0 .003-3.432z"/></svg>
        </span>
      </div>
      <div class="h-full flex items-center justify-center gap-3">
        <span class="time-desktop text-slate-400 lg:inline hidden"><span class="current"></span> / <span class="duration"></span></span>
        <div class="volume flex items-center">
          <span class="unmute w-8 h-8 md:w-10 md:h-10 flex justify-center items-center cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#cad5e2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-volume-2 preview-icon h-4.5 md:w-5 md:h-5"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><path d="M16 9a5 5 0 0 1 0 6"/><path d="M19.364 18.364a9 9 0 0 0 0-12.728"/></svg>
          </span>
          <span class="mute w-8 h-8 md:w-10 md:h-10 flex justify-center items-center cursor-pointer hidden">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#cad5e2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-volume-x preview-icon h-4.5 md:w-5 md:h-5"><path d="M11 4.702a.7.7 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.7.7 0 0 0 11 19.298z"/><path d="m16.5 14.5 5-5"/><path d="m16.5 9.5 5 5"/></svg>
          </span>
          <input type="range" min="0" max="10" value="10" name="volume" id="volume" class="volume-progress w-25 md:w-35 h-1 bg-slate-300 transition accent-violet-600 cursor-pointer">
        </div>
      </div>
    </div>
  </div>
  <header class="container m-auto z-10">
    <div class="flex justify-between items-center w-full h-10 sm:h-12.5 lg:h-15 px-2.5 lg:px-5 border-slate-300 border-b bg-slate-900">
      <div class="logo h-full p-0.5">
        <img class="h-full" src="/images/logo/Reamusic-logo.png" alt="Reamusic-logo">
      </div>
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#cad5e2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search preview-icon search-icon"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
    </div>
  </header>
  <section class="hero-section container m-auto relative">
    <img class="w-full h-100 sm:h-125 md:h-150 lg:h-180 xl:h-auto 2xl:h-216 contrast-125" src="/images/hero/Reamusic-Hero.png" alt="">
    <div class="absolute w-full h-full bg-linear-to-r from-black/95 via-black/25 to-black/10 top-0"></div>
    <div class="hero-text absolute w-full top-4/10 p-1 px-5 sm:px-7.5 lg:px-10 z-10">
      <p class="text-md lg:text-xl text-gray-400">Good Music. Better Mood</p>
      <p class="text-2xl sm:text-3xl md:text-4xl lg:text-5xl xl:text-6xl mb-2">
        Discover Your
        <br>
        <span class="text-violet-600">Soundtracks</span>
      </p>
      <p class="text-md lg:text-xl text-gray-400">Explore, play and enjoy your favourite music all in one place.</p>
    </div>
  </section>
  <section id="search" class="search container flex justify-center m-auto pt-15 mb-10 relative z-20">
    <div class="search-input w-full lg:w-3xl h-12.5 mx-5 sm:mx-7.5">
      <input class="w-full h-full border border-slate-300 bg-slate-900 p-3 rounded-xl text-slate-300" type="search" name="search" id="search-input" placeholder="Search...">
    </div>
    <div class="search-result w-[calc(100%-40px)] sm:w-[calc(100%-60px)] lg:w-3xl h-80 rounded-xl mt-1 px-5 border border-slate-300 bg-slate-900 scrollbar-thin overflow-auto scrollbar-thumb-slate-800 scrollbar-track-slate-300 absolute top-27.5 z-10 hidden">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#cad5e2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x preview-icon search-result-close-icon absolute right-1 top-1 cursor-pointer"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      <p class="search-result-title text-center text-lg mt-36.5">search for musics, genres, ...</p>
      <div class="search-result-wrapper"></div>
    </div>
  </section>
  <section class="genres container m-auto my-15 px-5 sm:px-7.5 lg:px-10">
    <div class="genres-text text-2xl mt-15 mb-5 flex items-baseline">
      <span class="mr-2">Genres</span>
      <div class="genres-container flex flex-wrap"></div>
    </div>
    <div class="swiper genres-slider">
      <div class="swiper-wrapper">

      </div>
    </div>
  </section>
  <section class="recently-added container m-auto my-15 px-5 sm:px-7.5 lg:px-10">
    <p class="text-2xl mt-15 mb-5">Recently Added</p>
    <div class="swiper recently-added-slider">
      <div class="swiper-wrapper">

      </div>
    </div>
  </section>
  <section class="trending container m-auto my-15 px-5 sm:px-7.5 lg:px-10">
    <p class="text-2xl mt-15 mb-5">Trending</p>
    <div class="swiper trending-slider">
      <div class="swiper-wrapper">

      </div>
    </div>
  </section>
  <footer class="container m-auto h-10 sm:h-12.5 lg:h-15 border-slate-300 border-t backdrop:blur-sm bg-slate-900 flex items-center justify-center">
    <p>Powered by <a href="https://github.com/lRezamn" target="_blank" class="text-violet-600 font-bold">lRezamn</a></p>
  </footer>
  <script type="module" src="/src/js/main.js"></script>
</body>
</html>
